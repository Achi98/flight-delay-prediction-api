name: Continuous Delivery

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        env:
          REGION: ${{ secrets.GCP_REGION }}
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
          # Puedes mantenerlo por secreto, pero debe ser EXACTAMENTE "flight-delay-repo" en minúsculas
          AR_REPO: ${{ secrets.GCP_AR_REPO }}
          IMAGE: flight-delay-api
        run: |
          echo "PROJECT_ID=$PROJECT_ID"
          echo "REGION=$REGION"
          echo "AR_REPO=$AR_REPO"
          echo "IMAGE=$IMAGE"

          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${IMAGE}:latest"
          IMAGE_URI_LC="$(echo "$IMAGE_URI" | tr '[:upper:]' '[:lower:]')"

          echo "IMAGE_URI (original) = $IMAGE_URI"
          echo "IMAGE_URI (lowercase) = $IMAGE_URI_LC"

          docker build -t "$IMAGE_URI_LC" .
          docker push "$IMAGE_URI_LC"

      - name: Deploy to Cloud Run
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
          SERVICE: ${{ secrets.GCP_SERVICE }}
          AR_REPO: ${{ secrets.GCP_AR_REPO }}
          IMAGE: flight-delay-api
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${IMAGE}:latest"
          IMAGE_URI_LC="$(echo "$IMAGE_URI" | tr '[:upper:]' '[:lower:]')"

          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE_URI_LC" \
            --allow-unauthenticated